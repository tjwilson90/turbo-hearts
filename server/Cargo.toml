[package]
name = "turbo-hearts"
version = "0.1.0"
authors = ["Tim Wilson <twilson@palantir.com>"]
edition = "2018"

[dependencies]
base64 = "0.23.1"
env_logger = { version = "0.11.11", default-features = false, features = ["humantime", "regex"] }
futures-util = "0.3.34"
http = "1.5.0"
log = "0.4.35"
once_cell = "1.21.4"
openidconnect = { version = "4.1.0", default-features = false, features = ["timing-resistant-secret-traits"] }
percent-encoding = "2.3.2"
rayon = "1.12.0"
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
rand = "0.10.3"
rand_distr = "0.6.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls"] }
# Keep aligned with r2d2_sqlite's SQLite native-library dependency.
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "parking_lot", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1.19"
turbo-hearts-api = { path = "../api" }
turbo-hearts-bot = { path = "../bot" }
uuid = { version = "1.29.0", features = ["serde", "v4"] }
warp = { version = "0.4.3", default-features = false, features = ["server"] }

[dev-dependencies]
tempfile = "3.27.0"
warp = { version = "0.4.3", default-features = false, features = ["test"] }
