[package]
name = "turbo-hearts-api"
version = "0.1.0"
authors = ["Tim Wilson <twilson@palantir.com>"]
edition = "2018"

[dependencies]
log = "0.4.35"
rand = "0.10.3"
rand_chacha = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["serde", "v4"] }

[dev-dependencies]
# 3.0.0 is a compile-error placeholder; 2.x supports the legacy training format.
bincode = { version = "2.0.1", features = ["serde"] }
criterion = "0.8.2"
env_logger = { version = "0.11.11", default-features = false, features = ["humantime", "regex"] }
serde_test = "1.0.177"
tempfile = "3.27.0"

[[bench]]
name = "trick"
harness = false

[[bench]]
name = "game_state"
harness = false
