[package]
name = "turbo-hearts-bot"
version = "0.1.0"
authors = ["Tim Wilson <twilson@palantir.com>"]
edition = "2018"

[dependencies]
log = "0.4.35"
rand = "0.10.3"
rand_chacha = "0.10.0"
turbo-hearts-api = { path = "../api" }

[dev-dependencies]
